services:
  mediawiki:
    image: mediawiki
    restart: always
    links:
      - database
    volumes:
      - images:/var/www/html/images
      - ./LocalSettings.php:/var/www/html/LocalSettings.php
    networks:
      - local
      - db
      - cloudflared
  database:
    image: mariadb
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - db:/var/lib/mysql
    networks:
      - db

volumes:
  images:
  db:

networks:
  db:
  local:
    external: true
  cloudflared:
    external: true
