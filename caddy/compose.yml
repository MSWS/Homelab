services:
  caddy:
    # image: ghcr.io/caddybuilds/caddy-cloudflare:latest
    build: .
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "22:22"
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "993:993"
      - "465:465"
    volumes:
      - $PWD/Caddyfile:/etc/caddy/Caddyfile
      - ./site-configs:/site-configs
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    environment:
      - CADDY_ADMIN=caddy-caddy-1:2019
    networks:
      - cloudflared
      - local

volumes:
  caddy_data:
  caddy_config:

networks:
  cloudflared:
    external: true
  local:
    external: true
