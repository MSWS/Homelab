services:
  uptime-kuma:
    image: louislam/uptime-kuma:2-slim
    container_name: uptime-kuma
    restart: always
    volumes:
      - uptime-kuma:/app/data
    networks:
      - cloudflared
    extra_hosts:
      - "code.msws.xyz:10.0.0.101"

networks:
  cloudflared:
    external: true

volumes:
  uptime-kuma:
